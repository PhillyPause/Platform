# DigitalOcean App Platform spec for phillypause.org.
#
# Apply with:
#   doctl apps create --spec Deploy/digitalocean/app.yaml      (first time)
#   doctl apps update <app-id> --spec Deploy/digitalocean/app.yaml
#
# No Dockerfile: App Platform's native .NET buildpack detects Platform.slnx
# and handles the SDK and the publish. It supports .NET 10 on Ubuntu 22.
#
# This file is the record of what is deployed. Change it here and apply it,
# rather than editing the app in the control panel, or the two drift and the
# panel wins silently.

name: phillypause-platform
region: nyc

services:
  - name: website

    github:
      repo: PhillyPause/Platform
      branch: main
      # A merge to main ships. main is protected and requires build-and-test,
      # so nothing reaches here that has not already built and passed on CI.
      deploy_on_push: true

    # Four projects share the solution, so the buildpack is told which one to
    # resolve. BUILD_TIME scope: it is needed by `dotnet publish`, not at run.
    #
    # It has to be a bare filename — the buildpack rejects a path, so it
    # cannot be pointed at Website.Portal.csproj alone. That is why the
    # duplicate static-asset compression is disabled in Website.Client.csproj
    # instead; see the comment there.
    envs:
      - key: SOLUTION_FILE
        scope: BUILD_TIME
        value: Platform.slnx

      # Kestrel does not read $PORT. App Platform sets it to http_port below,
      # and without this the container listens on 5000 and the health check
      # never answers.
      - key: ASPNETCORE_URLS
        scope: RUN_TIME
        value: http://*:${PORT}

      # Switches on the production branches in Program.cs: HSTS, the HTTPS
      # redirect, and the exception handler instead of the developer page.
      - key: ASPNETCORE_ENVIRONMENT
        scope: RUN_TIME
        value: Production

      # ManyHands (Docs/ManyHands/MANYHANDS.md section 5). The connection
      # string is Npgsql's key-value form, built from the attached database's
      # bindable variables, so no password is written here.
      - key: ConnectionStrings__ManyHands
        scope: RUN_TIME
        value: Host=${db.HOSTNAME};Port=${db.PORT};Database=${db.DATABASE};Username=${db.USERNAME};Password=${db.PASSWORD};SSL Mode=Require

      - key: Email__Provider
        scope: RUN_TIME
        value: resend

      # Encrypted by App Platform; only the EV[...] form is committed.
      - key: Email__ApiKey
        scope: RUN_TIME
        type: SECRET
        value: EV[1:8z8doH0EuqfWhUAMT6eFWkDzO5Kgfp6y:Lu3blIWNHSjwG07GWDgKwydtJXhwjgi/HRImasrdAwumm7ZTGW5mte4OCRpGarF+hn860Q==]

      - key: Email__FromAddress
        scope: RUN_TIME
        value: join@mail.phillypause.org

      - key: Email__ReplyToAddress
        scope: RUN_TIME
        value: info@phillypause.org

      - key: Email__PublicBaseUrl
        scope: RUN_TIME
        value: https://phillypause.org

      # The first admin: an admin the first time they sign in.
      - key: ManyHands__Admins__0
        scope: RUN_TIME
        value: louis@phillypause.org

      # Last, so the deploy that turns it on has everything above.
      - key: ManyHands__Enabled
        scope: RUN_TIME
        value: "true"

    # 512 MiB is ample: content is parsed once at startup, and ManyHands'
    # background work is a mail outbox and little else.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    http_port: 8080

    # The home page is statically rendered, so a 200 here means the content
    # pipeline parsed and the component tree rendered — a real readiness
    # signal rather than a bare TCP check.
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      failure_threshold: 3

# ManyHands' Postgres: a managed cluster with daily backups and seven days
# of point-in-time restore. Attached as a component, which adds the app to
# its trusted sources and supplies ${db.*} above. It is never wiped or
# reset without a backup to reload from.
databases:
  - name: db
    engine: PG
    version: "17"
    production: true
    cluster_name: phillypause-pg
    db_name: manyhands
    db_user: doadmin

ingress:
  rules:
    # Everything to the one component. ManyHands is served by it too, under
    # its own routes, so there is no second rule (PLAN.md section 2.2).
    - component:
        name: website
      match:
        path:
          prefix: /

domains:
  - domain: phillypause.org
    type: PRIMARY
    # Cloudflare keeps the nameservers, so App Platform is told about the
    # domain but does not manage its DNS. The CNAME goes in at Cloudflare.
    zone: phillypause.org
  - domain: www.phillypause.org
    type: ALIAS
    zone: phillypause.org
