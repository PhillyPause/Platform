name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Platform.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so a warning
      # fails here by choice.
      - name: Build
        run: dotnet build Platform.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Platform.slnx --no-build -c Release

  # Transitive advisories are not a build break (NuGetAuditMode covers direct
  # ones), but they are not invisible either.
  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Platform.slnx

      - name: List vulnerable packages
        run: dotnet list Platform.slnx package --vulnerable --include-transitive
